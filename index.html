<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12151f">
  <meta name="description" content="Quareia 占卜：支持塔罗与 Mystagogus（M 牌），轻点牌堆抽牌，翻牌解读，预设牌阵与正逆位模式。">
  <title>Quareia 占卜 · Quareia Divination</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button type="button" class="support-fab" id="supportBtn" aria-haspopup="dialog" aria-controls="supportModal">
    支持作者
  </button>

  <div class="support-modal" id="supportModal" hidden>
    <div class="support-modal-backdrop" data-close-support></div>
    <div class="support-modal-panel" role="dialog" aria-modal="true" aria-labelledby="supportModalTitle">
      <button type="button" class="support-modal-close" data-close-support aria-label="关闭">×</button>
      <h2 id="supportModalTitle">支持作者</h2>
      <p class="support-modal-note">如果这个小站对你有用，欢迎随意打赏。感谢！</p>
      <div class="support-qr-grid">
        <figure class="support-qr">
          <img src="assets/support/pay-wechat.jpg" alt="微信支付收款码" width="300" height="409" loading="lazy">
          <figcaption>微信支付</figcaption>
        </figure>
        <figure class="support-qr">
          <img src="assets/support/pay-alipay.jpg" alt="支付宝收款码" width="300" height="450" loading="lazy">
          <figcaption>支付宝</figcaption>
        </figure>
      </div>
    </div>
  </div>

  <div class="page-wrapper">
    <header class="header">
      <h1>Quareia 占卜</h1>
      <p class="subtitle">QUAREIA DIVINATION · 塔罗 / Mystagogus</p>
    </header>

    <!-- 设置：可折叠，默认展开 -->
    <section class="settings" id="settings">
      <button class="settings-toggle" id="settingsToggle" aria-expanded="true" aria-controls="settingsBody">
        <span>抽牌设置</span>
        <span class="settings-chevron" aria-hidden="true">▾</span>
      </button>
      <div class="settings-body" id="settingsBody">
        <div class="setting-group">
          <label for="deckSelect">牌组</label>
          <select id="deckSelect">
            <option value="tarot">塔罗牌（Rider–Waite 体系）</option>
            <option value="mystagogus">M 牌（Mystagogus）</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="modeSelect">牌位模式</label>
          <select id="modeSelect">
            <option value="upright-only">全正位（推荐）</option>
            <option value="mixed">正逆位混合</option>
          </select>
        </div>
        <div class="setting-group" id="arcanaFilterGroup">
          <label for="arcanaFilter">牌组筛选</label>
          <select id="arcanaFilter">
            <option value="mixed">混合抽取</option>
            <option value="major-only">仅大阿卡那</option>
            <option value="minor-only">仅小阿卡那</option>
            <option value="major-then-minor">先大后小</option>
            <option value="minor-then-major">先小后大</option>
          </select>
        </div>
        <div class="setting-group setting-group-spread">
          <label for="spreadSelect">预设牌阵</label>
          <select id="spreadSelect" aria-describedby="spreadSettingSummary"></select>
          <p class="setting-summary" id="spreadSettingSummary"></p>
        </div>
      </div>
    </section>

    <!-- 牌堆：左右滑动浏览，轻点任意一张抽出 -->
    <section class="deck-area">
      <div class="deck-head">
        <h2>牌堆 · <span class="deck-remaining" id="deckRemaining">剩 78 张</span></h2>
        <button class="btn-mini" id="shuffleBtn" type="button">🔀 洗牌</button>
      </div>
      <p class="deck-cta" id="deckCta">左右滑动浏览牌堆，轻点任意一张牌抽出</p>
      <div class="deck-spread" id="deckSpread" role="group" aria-label="牌堆，左右滑动浏览，轻点抽牌"></div>
      <button class="btn btn-switch-arcana" id="switchArcanaBtn" style="display:none;">切换牌组</button>
    </section>

    <!-- 牌阵：抽到的牌自动排列 -->
    <section class="spread-area" id="spreadArea" style="display:none;">
      <div class="spread-head">
        <h2><span id="spreadTitle">你的牌阵</span> · <span class="card-count" id="spreadCount">0 / 3</span></h2>
        <span class="phase-label" id="phaseLabel"></span>
      </div>
      <div class="spread-board-scroll" id="spreadBoardScroll">
        <div class="spread-grid" id="spreadGrid" role="list" aria-label="抽取的牌按所选牌阵自动排列"></div>
      </div>
      <div class="spread-actions">
        <button class="btn btn-accent" id="revealBtn">开牌解读</button>
        <button class="btn btn-secondary" id="clearBtn">重新洗牌</button>
      </div>
      <p class="spread-hint" id="spreadHint">轻点任意一张牌可单独翻开，或按「开牌解读」全部翻开。</p>
      <details class="position-guide" id="positionGuide">
        <summary>查看牌位说明</summary>
        <ol id="positionGuideList"></ol>
      </details>
    </section>

    <!-- 解读结果 -->
    <section class="results-section" id="resultsSection" style="display:none;">
      <h2>解读结果</h2>
      <div class="results-list" id="resultsList"></div>
    </section>

    <footer class="footer">
      <p>塔罗牌意参考《21世纪的塔罗技能》与 Quareia 语境；M 牌关键词译自 Josephine McCarthy《Mystagogus》· 仅供娱乐，请理性看待占卜结果</p>
    </footer>
  </div>

  <script src="js/tarot-data.js"></script>
  <script src="js/mystagogus-data.js"></script>
  <script src="js/spreads.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
