name = "quareia-telemetry"
main = "src/index.js"
compatibility_date = "2025-07-01"

# ---------------------------------------------------------------------------
# Analytics Engine binding. The worker writes one data point per accepted event.
# This binding must be created by an operator with Cloudflare access — it is
# NOT created automatically by `wrangler deploy` for Analytics Engine.
#
# Create the dataset first, then keep the dataset name below in sync.
# ---------------------------------------------------------------------------

# Uncomment and set after creating the dataset in the Cloudflare dashboard:
# [[analytics_engine_datasets]]
# binding = "TELEMETRY"
# dataset = "quareia_telemetry"

# ---------------------------------------------------------------------------
# Custom domain. telemetry.luotianyi.fun must be bound to this worker in the
# Cloudflare dashboard (Websites -> the luotianyi.fun zone -> Workers Routes,
# or Workers & Pages -> the worker -> Settings -> Triggers -> Custom Domains).
# This file does NOT perform that binding automatically.
# ---------------------------------------------------------------------------

# routes = [
#   { pattern = "telemetry.luotianyi.fun/*", zone_name = "luotianyi.fun" }
# ]

[vars]
# Tuneable limits and retention. Changes here require a redeploy.
RATE_LIMIT_PER_INSTALL_PER_HOUR = "60"
RATE_LIMIT_PER_IP_PER_MINUTE = "30"
SECURITY_LOG_TTL_DAYS = "7"
