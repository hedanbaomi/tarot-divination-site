name = "quareia-telemetry"
main = "src/index.js"
compatibility_date = "2025-07-01"

# The existing telemetry.luotianyi.fun Custom Domain is managed in the
# Cloudflare Dashboard; this worker never publishes to workers.dev and uses
# no URL routes. workers_dev = false keeps the Dashboard Custom Domain as the
# only serving trigger.
workers_dev = false

# ---------------------------------------------------------------------------
# Analytics Engine binding. The worker writes one data point per accepted event.
# The dataset is created automatically by Cloudflare on the first write after
# this binding is configured; no dashboard dataset-creation step is required.
#
# Keep the dataset name stable so SQL queries continue to address the same table.
# ---------------------------------------------------------------------------

[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "quareia_telemetry"

# ---------------------------------------------------------------------------
# D1 database for announcements and the current per-install active state.
# The database must be created once with `wrangler d1 create quareia`, then
# database_id below replaced with the returned identifier. Apply migrations
# with `wrangler d1 migrations apply quareia` (add --local for local dev).
# The placeholder below is a non-functional UUID used for local development
# only; it MUST be replaced before the first production deployment.
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "quareia"
database_id = "fc0222c6-5593-47f2-a9cd-149bb77c93b4"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Daily cron: removes install_state rows inactive for more than 90 days.
# The handler itself is a no-op when the D1 binding is missing.
# ---------------------------------------------------------------------------

[triggers]
crons = ["0 3 * * *"]

# ---------------------------------------------------------------------------
# Admin authentication: the ADMIN_TOKEN secret is supplied through
# `wrangler secret put ADMIN_TOKEN` (production) or `.dev.vars` (local dev).
# It is never stored in this file or the repository, and it must never be
# placed in URLs, logs, or client-side storage beyond sessionStorage.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Custom domain. telemetry.luotianyi.fun must be bound to this worker in the
# Cloudflare dashboard (Websites -> the luotianyi.fun zone -> Workers Routes,
# or Workers & Pages -> the worker -> Settings -> Triggers -> Custom Domains).
# This file does NOT perform that binding automatically.
# ---------------------------------------------------------------------------

# routes = [
#   { pattern = "telemetry.luotianyi.fun/*", zone_name = "luotianyi.fun" }
# ]

[vars]
# Ordinary, non-secret Cloudflare account configuration used only by the
# read-only Analytics Engine SQL API. Leave empty until the authorized
# operator supplies the real account id.
ACCOUNT_ID = ""
# Tuneable in-memory limits. Changes here require a redeploy.
RATE_LIMIT_PER_INSTALL_PER_HOUR = "60"
RATE_LIMIT_PER_IP_PER_MINUTE = "30"

# ANALYTICS_READ_TOKEN is intentionally absent from this file. Set it only as
# a Worker secret with `wrangler secret put ANALYTICS_READ_TOKEN`; it must
# never be placed in vars, source, URLs, logs, or responses.
